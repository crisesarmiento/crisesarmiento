<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img" aria-labelledby="sp-light-t sp-light-d">
<title id="sp-light-t">Language spectrum of public repositories</title>
<desc id="sp-light-d">Language byte shares in public owned non-fork repositories only.</desc>
<style>
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="860" height="188" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="28" y="18" width="28" height="3" rx="1.5" fill="#0891B2"/>
<text x="28" y="42" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" letter-spacing="1.8" fill="#0891B2">SPECTRUM  //  PUBLIC REPOS ONLY</text>
<circle class="pulse" cx="818" cy="38" r="3.5" fill="#0891B2"/>
<text x="808" y="42" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0.4" fill="#64748B">BY SOURCE BYTES</text>
<text x="28" y="76" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#0B0F14">TypeScript</text>
<rect x="200" y="68" width="580" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
<rect x="200" y="68" width="361.0" height="12" rx="2" fill="#0891B2"/>
