<text x="28" y="96" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#0B0F14">JavaScript</text>
<rect x="200" y="88" width="580" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
<rect x="200" y="88" width="91.7" height="12" rx="2" fill="#0891B2"/>
<text x="788" y="98" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0" fill="#64748B">15.8%</text>
<text x="28" y="116" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#0B0F14">Python</text>
<rect x="200" y="108" width="580" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
<rect x="200" y="108" width="54.4" height="12" rx="2" fill="#0891B2"/>
<text x="788" y="118" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0" fill="#64748B">9.4%</text>
<text x="28" y="136" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#0B0F14">CSS</text>
<rect x="200" y="128" width="580" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
<rect x="200" y="128" width="17.8" height="12" rx="2" fill="#0891B2"/>
<text x="788" y="138" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0" fill="#64748B">3.1%</text>
<text x="28" y="156" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#0B0F14">QML</text>
<rect x="200" y="148" width="580" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
<rect x="200" y="148" width="16.3" height="12" rx="2" fill="#0891B2"/>
<text x="788" y="158" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0" fill="#64748B">2.8%</text>
<text x="28" y="176" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="400" letter-spacing="0" fill="#64748B">Bytes in every public, owned, non-fork repository; every language counted. Private consultancy work is not included, and is not shown as zero.</text>
